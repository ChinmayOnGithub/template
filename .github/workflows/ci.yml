name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Lint, Typecheck, Headers, Test, Build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/template_ci"
      AUTH_SECRET: "ci_testing_auth_secret_must_be_at_least_32_characters_long"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema and generate client
        run: bunx prisma validate && bunx prisma generate

      - name: Validate template integrity
        run: bun run validate-template

      - name: Verify file headers
        run: bun run check-headers

      - name: Check code formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run unit & integration tests
        run: bun run test

      - name: Build application
        run: bun run build

  e2e:
    name: Browser Tests (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/template_ci"
      AUTH_SECRET: "ci_testing_auth_secret_must_be_at_least_32_characters_long"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/template_ci"
        run: bunx prisma generate

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build application
        run: bun run build

      - name: Run Playwright tests
        run: bun run test:e2e
        env:
          CI: true

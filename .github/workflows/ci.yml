name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Lint, Typecheck, Headers, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate template integrity
        run: bun run validate-template

      - name: Verify file headers
        run: bun run check-headers

      - name: Check code formatting
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            git diff --name-only -z FETCH_HEAD |
              xargs -0 -r bunx prettier --write --ignore-unknown
            git diff -- .agents/scripts tests/context .github/workflows
            exit 1
          else
            git diff-tree --no-commit-id --name-only -z -r "$GITHUB_SHA" |
              xargs -0 -r bunx prettier --write
            git diff -- .agents/scripts tests/context .github/workflows
            exit 1
          fi

      - name: Run linter
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run unit & integration tests
        run: bun run test

      - name: Build application
        run: bun run build

  e2e:
    name: Browser Tests (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:e2e
        env:
          CI: true

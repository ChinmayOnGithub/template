name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Lint, Typecheck, Headers, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate template integrity
        run: bun run validate-template

      - name: Verify file headers
        run: bun run check-headers

      - name: Format changed security files for review
        run: |
          bunx prettier --write app/api/integration/v1/events/route.ts lib/billing/adapter.ts lib/saas-integration/auth.ts lib/saas-integration/client.ts tests/security-hardening.test.ts
          git diff -- app/api/integration/v1/events/route.ts lib/billing/adapter.ts lib/saas-integration/auth.ts lib/saas-integration/client.ts tests/security-hardening.test.ts

      - name: Run linter
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run unit & integration tests
        run: bun run test

      - name: Build application
        run: bun run build

  e2e:
    name: Browser Tests (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build application
        run: bun run build

      - name: Run Playwright tests
        run: bun run test:e2e
        env:
          CI: true

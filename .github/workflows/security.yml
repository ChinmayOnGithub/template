name: Security Review

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  audit:
    name: Dependency Audit and Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate committed secrets safety
        run: bun run validate-template

      - name: Enforce zero critical vulnerabilities
        run: bun audit --audit-level=critical

      - name: Report dependency vulnerability matrix
        run: bun audit || true
